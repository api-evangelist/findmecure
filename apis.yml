name: FindMeCure
description: FindMeCure is a Sofia, Bulgaria healthtech company (founded 2015, backed by Techstars) that
  connects patients with clinical trials through a patient-facing search engine often described as "the
  Google of clinical trials," letting people search, find, and join a trial within a few clicks. Its
  sister B2B product, TrialHub, is a clinical-trial strategy, feasibility, and patient-recruitment
  intelligence platform covering 70 countries and serving pharmaceutical sponsors and CROs including
  Takeda, Novartis, and Syneos Health. No public developer API is currently documented; this profile
  captures the company's identity and probed domain security posture.
